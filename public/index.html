<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="%PUBLIC_URL%/logo192.png" sizes="192x192" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#180d8f" />

  <!-- Эти title/description видят боты превью ссылок (Telegram и т.п.):
       JavaScript они не запускают и читают только этот HTML. Превью — только
       на английском для любой ссылки, включая /uz (требование института;
       русского быть не должно вообще).
       Теги с data-static-seo src/index.js удаляет при запуске в браузере:
       React 19 + react-helmet-async не заменяют статичные теги, а добавляют
       свои рядом, и без удаления были бы дубли title/description. В
       браузере их задают DefaultSeo.jsx и Helmet конкретной страницы. -->
  <title data-static-seo>Institute of Anthropology — Academy of Sciences of the Republic of Uzbekistan</title>
  <meta data-static-seo name="description" content="Official website: research, publications, academic councils, staff and news." />

  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <!-- Open Graph / соцсети. og:url не задаём: он свой у каждой страницы. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Institute of Anthropology" />
  <meta data-static-seo property="og:title" content="Institute of Anthropology — Academy of Sciences of the Republic of Uzbekistan" />
  <meta data-static-seo property="og:description" content="Official website: research, publications, academic councils, staff and news." />
  <meta property="og:image" content="https://anthropology.uz/logo512.png" />
  <meta property="og:locale" content="en_US" />

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:image" content="https://anthropology.uz/logo512.png" />

  <!-- Structured data — помогает Google связать разные варианты названия
       (англ/узб) с одной и той же организацией (Knowledge Graph). -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ResearchOrganization",
      "name": "Institute of Anthropology",
      "alternateName": [
        "Antropologiya instituti",
        "O'zbekiston Respublikasi Fanlar akademiyasi Antropologiya instituti",
        "IAASU"
      ],
      "url": "https://anthropology.uz",
      "logo": "https://anthropology.uz/logo512.png",
      "image": "https://anthropology.uz/logo512.png",
      "email": "anthropology@academy.uz",
      "telephone": "+998712626462",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Mirzo Ulug'bek ko'chasi, 81",
        "addressLocality": "Toshkent",
        "postalCode": "100170",
        "addressCountry": "UZ"
      },
      "parentOrganization": {
        "@type": "Organization",
        "name": "Academy of Sciences of the Republic of Uzbekistan",
        "url": "https://academy.uz"
      },
      "sameAs": [
        "https://academy.uz",
        "https://my.academy.uz",
        "https://oak.uz",
        "https://daraja.ilmiy.uz",
        "https://uzarchaeology.uz",
        "https://t.me/anthropubhub"
      ]
    }
  </script>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>
</html>
